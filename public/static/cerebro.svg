<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 880" role="img"
     aria-label="El Cerebro: la pieza central del equipo" class="pieza">
  <!-- Dibujo unico, sin imagen generada: vectorial para que pueda reaccionar al raton y latir.
       Un <img> no ejecuta ni CSS de estado ni :hover, asi que este fichero se INCRUSTA en el DOM
       (app.js en el puesto de mando, cerebro-inline.js en el sitio publico) en vez de enlazarse.
       Sin un solo hex propio: hereda las variables de tokens.css, con fallback por si se abre suelto.
       Vista lateral mirando a la izquierda: polo frontal a la izquierda, occipital a la derecha,
       lobulo temporal colgando al frente y cerebelo metido debajo del occipital. -->
  <defs>
    <radialGradient id="cb-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--catodo, #dc5000)" stop-opacity=".22"/>
      <stop offset="52%" stop-color="var(--catodo, #dc5000)" stop-opacity=".06"/>
      <stop offset="100%" stop-color="var(--catodo, #dc5000)" stop-opacity="0"/>
    </radialGradient>

    <!-- Las circunvoluciones. NO son arcos concentricos: cada una ondula dos o tres veces de
         delante a atras, que es lo que hace que una masa se lea como un cerebro plegado y no como
         un arcoiris de rayas. Se declaran una vez y se usan dos: en madera (el pliegue) y en brasa
         (el impulso que lo recorre). Un solo trazado, dos lecturas. -->
    <path id="cb-s1" d="M228 316 C266 268 320 254 358 282 C392 307 400 348 440 354 C486 361 512 322 556 320 C602 318 638 348 662 386"/>
    <path id="cb-s2" d="M180 392 C222 340 278 326 318 352 C354 375 366 418 408 424 C454 431 478 390 524 386 C574 382 614 414 642 456"/>
    <path id="cb-s3" d="M162 462 C206 416 262 406 302 432 C340 456 352 498 394 504 C442 511 468 470 514 468 C566 466 606 500 632 542"/>
    <path id="cb-s4" d="M186 528 C230 488 286 480 326 504 C364 527 378 566 420 572 C466 578 492 540 536 540 C580 540 612 566 634 596"/>
    <path id="cb-s5" d="M298 240 C346 212 404 206 452 224 C494 240 516 274 556 268"/>
    <path id="cb-s6" d="M660 300 C700 340 720 392 718 444 C716 486 700 520 674 546"/>
    <path id="cb-s7" d="M268 558 C324 586 398 596 466 590 C518 586 558 572 586 552"/>
  </defs>

  <style>
    .pieza { overflow: visible; }
    .corteza  { fill: none; stroke: var(--hueso, #ffedd7); stroke-opacity: .94; stroke-width: 7; }
    .cerebelo { fill: none; stroke: var(--hueso, #ffedd7); stroke-opacity: .82; stroke-width: 5.5; }
    .tallo    { fill: none; stroke: var(--hueso, #ffedd7); stroke-opacity: .72; stroke-width: 6.5; }
    .cisura   { fill: none; stroke: var(--hueso-2, #d8c3a8); stroke-opacity: .7; stroke-width: 4.5; }
    .surcos   { fill: none; stroke: var(--bronce, #8a7a68); stroke-opacity: .9; stroke-width: 3.6; }
    .pliegues { fill: none; stroke: var(--bronce, #8a7a68); stroke-opacity: .55; stroke-width: 3; }
    .corteza, .cerebelo, .tallo, .cisura, .surcos, .pliegues { stroke-linecap: round; stroke-linejoin: round; }

    /* El axon central —la cisura de Rolando— es la unica brasa constante de la pieza. */
    .axon { fill: none; stroke: var(--catodo, #dc5000); stroke-width: 6; stroke-linecap: round; }

    /* EL IMPULSO. Cada surco lleva encima una copia en brasa recortada a un guion corto; lo que
       viaja es el guion, no un objeto que haya que mover. Es una sola propiedad animada
       (stroke-dashoffset), la compone el navegador, y se apaga sola con prefers-reduced-motion.
       `fill: none` no es decorativo: sin el, la copia se rellena de negro y tapa el surco. */
    .impulsos use {
      fill: none;
      stroke: var(--catodo, #dc5000);
      stroke-width: 4.6;
      stroke-linecap: round;
      stroke-dasharray: 30 640;
      stroke-dashoffset: 670;
      opacity: 0;
      animation: cb-viaja 5.2s linear infinite;
    }
    .impulsos use:nth-child(1) { animation-delay: 0s;    }
    .impulsos use:nth-child(2) { animation-delay: -3.9s; }
    .impulsos use:nth-child(3) { animation-delay: -1.3s; }
    .impulsos use:nth-child(4) { animation-delay: -2.6s; }
    .impulsos use:nth-child(5) { animation-delay: -4.6s; }
    .impulsos use:nth-child(6) { animation-delay: -0.7s; }
    .impulsos use:nth-child(7) { animation-delay: -3.2s; }
    .impulsos use:nth-child(8) { animation-delay: -1.9s; }
    .impulsos use:nth-child(9) { animation-delay: -4.2s; }
    @keyframes cb-viaja {
      0%        { stroke-dashoffset: 670; opacity: 0; }
      8%        { opacity: .95; }
      72%       { opacity: .95; }
      86%, 100% { stroke-dashoffset: 340; opacity: 0; }
    }

    /* Los nodos respiran desfasados: la pieza nunca esta del todo quieta. */
    .nodo { fill: var(--hueso, #ffedd7); animation: cb-respira 4.4s ease-in-out infinite; }
    .nodo:nth-of-type(2n) { animation-delay: -1.5s; }
    .nodo:nth-of-type(3n) { animation-delay: -2.9s; }
    @keyframes cb-respira { 0%, 100% { opacity: .3; r: 4; } 50% { opacity: .9; r: 6; } }

    /* INTERACCION. Apuntar la pieza acelera el trafico y enciende los nodos: la respuesta es del
       dibujo, no de un tooltip. El giro con el raton lo pone el CSS de cada sitio. */
    .pieza:hover .impulsos use { animation-duration: 2.1s; }
    .pieza:hover .nodo         { animation-duration: 1.7s; fill: var(--catodo, #dc5000); }
    .pieza:hover .axon         { stroke-width: 7.5; }
    .axon, .nodo { transition: stroke-width .3s ease, fill .3s ease; }

    /* ESTADOS. Las clases NO se ponen aqui: las escribe app.js sobre #cerebro-marco, que ya las
       usaba con la imagen. Por eso los selectores miran al ancestro — asi este dibujo entra en el
       puesto de mando sin tocar una linea de la logica del chat. */
    .pensando .impulsos use { animation-duration: 1.15s; }
    .pensando .nodo         { animation-duration: 1.15s; fill: var(--catodo, #dc5000); }
    .encendido .axon        { animation: cb-golpe .5s ease-out 1; }
    .encendido .nodo        { fill: var(--catodo, #dc5000); }
    @keyframes cb-golpe {
      0%   { stroke-width: 6;  filter: none; }
      30%  { stroke-width: 13; filter: drop-shadow(0 0 26px var(--catodo, #dc5000)); }
      100% { stroke-width: 6;  filter: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .impulsos use { animation: none; opacity: .45; stroke-dasharray: none; stroke-dashoffset: 0; }
      .nodo { animation: none; opacity: .6; }
      .encendido .axon { animation: none; }
    }
  </style>

  <circle cx="440" cy="440" r="440" fill="url(#cb-halo)"/>

  <g class="masa">
    <!-- Corteza: una masa limpia, mas ancha que alta, con el polo frontal abajo-izquierda, el
         vertice arriba y el occipital a la derecha. Sin escotaduras en el contorno — se probo y
         convertia la silueta en un cuenco; lo que separa los lobulos son las cisuras de dentro. -->
    <path class="corteza" d="M132 456
      C120 356 190 264 302 224
      C398 190 510 192 598 234
      C688 277 750 350 758 434
      C766 510 724 568 648 590
      C568 614 462 618 368 602
      C270 585 188 548 150 502
      C134 483 132 470 132 456 Z"/>

    <!-- La cisura de Silvio: el corte hondo que separa el temporal del resto. Es la marca que hace
         que esto se lea como un cerebro y no como un canto rodado. -->
    <path class="cisura" d="M186 486 C262 528 376 548 476 538 C540 532 590 512 620 480"/>

    <!-- SIN CEREBELO NI TALLO. Se dibujaron y se quitaron: a 520px de ancho la masa de debajo
         del occipital no se lee metida bajo la corteza sino pegada por fuera, y el tallo queda de
         gancho suelto. La silueta del cerebro se sostiene con los pliegues; las dos piezas que no
         se leen restaban en vez de sumar. Viven en el commit anterior si hay que volver. -->

    <g class="surcos">
      <use href="#cb-s1"/><use href="#cb-s2"/><use href="#cb-s3"/><use href="#cb-s4"/>
      <use href="#cb-s5"/><use href="#cb-s6"/><use href="#cb-s7"/>
    </g>

    <g class="impulsos">
      <use href="#cb-s1"/><use href="#cb-s2"/><use href="#cb-s3"/><use href="#cb-s4"/>
      <use href="#cb-s5"/><use href="#cb-s6"/><use href="#cb-s7"/>
    </g>

    <!-- Cisura de Rolando: del vertice hacia abajo y adelante, hasta morir en la de Silvio. -->
    <path class="axon" d="M486 200 C476 286 448 362 412 426 C396 454 384 486 380 520"/>

    <g class="nodos">
      <circle class="nodo" cx="228" cy="316" r="4"/>
      <circle class="nodo" cx="662" cy="386" r="4"/>
      <circle class="nodo" cx="180" cy="392" r="4"/>
      <circle class="nodo" cx="642" cy="456" r="4"/>
      <circle class="nodo" cx="162" cy="462" r="4"/>
      <circle class="nodo" cx="632" cy="542" r="4"/>
      <circle class="nodo" cx="186" cy="528" r="4"/>
      <circle class="nodo" cx="298" cy="240" r="4"/>
      <circle class="nodo" cx="556" cy="268" r="4"/>
      <circle class="nodo" cx="268" cy="558" r="4"/>
      <circle class="nodo" cx="586" cy="552" r="4"/>
    </g>
  </g>
</svg>
